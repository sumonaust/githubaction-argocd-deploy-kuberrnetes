name: Kubernetes CI

on:
  push:
    branches:
      - main

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout APP repo (no token needed)
      - name: Checkout App Repo
        uses: actions/checkout@v4

      # ✅ Build Docker Image
      - name: Build Docker Image
        run: docker build -t sumonaust/gha-pyapp:${GITHUB_SHA::7} .

      # ✅ Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ Push Image
      - name: Push Docker Image
        run: docker push sumonaust/gha-pyapp:${GITHUB_SHA::7}

      # 🔥 Checkout MANIFEST repo (WITH TOKEN)
      - name: Checkout Manifest Repo
        uses: actions/checkout@v4
        with:
          repository: sumonaust/kubernetes-manifest
          token: ${{ secrets.GH_PAT }}
          path: kubernetes-manifest

      # ✅ Install yq
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # ✅ Update deployment.yaml
      - name: Update deployment.yaml
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          cd kubernetes-manifest
          yq -i '.spec.template.spec.containers[0].image = "sumonaust/gha-pyapp:'"$SHORT_SHA"'"' k8s/pyapp-deployment.yml

      # ✅ Commit & Push changes
      - name: Commit & Push changes
        run: |
          cd kubernetes-manifest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@noreply.github.com"
          git add k8s/pyapp-deployment.yml
          git commit -m "Update image tag to ${GITHUB_SHA::7}" || echo "No changes"
          git push