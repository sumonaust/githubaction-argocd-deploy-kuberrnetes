name: Kubernetes CI (main)
on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/pyapp-deployment.yml

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t sumonaust/gha-pyapp:${GITHUB_SHA::7} .

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: docker push sumonaust/gha-pyapp:${GITHUB_SHA::7}

      - run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - run: |
          SHORT_SHA=${GITHUB_SHA::7}
          yq -i ".spec.template.spec.containers[0].image = \"sumonaust/gha-pyapp:${SHORT_SHA}\"" ./k8s/pyapp-deployment.yml

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@noreply"
          git add k8s/pyapp-deployment.yml
          git diff --quiet || git commit -m "docker tag updated by GHA"
          git push origin main